server:
  port: 8082

spring:
  application:
    name: ms-salas

  datasource:
    url: jdbc:mysql://mysqldb:3306/db_salas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: rootpassword
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

gateway:
  internal-secret: "MiSecretoSuperSeguroGateway2026"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
